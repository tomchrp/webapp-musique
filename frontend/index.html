<!--
==============================================================================
Chemin : frontend/index.html
Utilité : Structure principale de l'interface utilisateur (HTML5).
Modifications :
  - Suppression du texte par défaut "Lecture en cours" dans le span 
    #full-player-status. L'élément est conservé pour les statuts Gemini.
  - Nettoyage des anciennes classes du modal d'ajout de playlist.
==============================================================================
-->
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Music AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="background-blur"></div>

    <div id="toast-container" class="hidden"></div>

    <div class="app-container">

        <!-- TOP BAR FIXE -->
        <header class="top-zone">
            <div class="search-wrapper">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Rechercher un titre..." autocomplete="off">
                </div>
                <div id="search-results" class="search-results-dropdown hidden"></div>
            </div>

            <div class="volume-control header-icon">
                <button id="btn-volume" class="btn-icon" aria-label="Volume">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path
                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                    </svg>
                </button>
                <input type="range" id="volume-slider" class="volume-slider hidden" min="0" max="1" step="0.01"
                    value="0.5">
            </div>

            <div class="fab-wrapper header-icon">
                <button id="toggle-btn" class="fab-btn btn-disconnected"></button>
            </div>
        </header>

        <!-- CONTENEUR DES VUES (SPA) -->
        <main id="app-content" class="content-zone">

            <!-- VUE 1 : ACCUEIL -->
            <section id="view-home" class="view-section">
                <div class="carousel-container">
                    <div class="section-header">
                        <h2 id="title-recent" class="section-title">Écoutés récemment</h2>
                        <button id="btn-recent-all" class="btn-text hidden">Tout afficher</button>
                    </div>
                    <div id="recent-carousel" class="carousel-viewport">
                        <!-- Pages 3x3 générées par JS -->
                    </div>
                    <div id="recent-pagination" class="pagination-dots"></div>
                </div>

                <div class="carousel-container">
                    <div class="section-header">
                        <h2 id="title-playlists" class="section-title">Mes Playlists</h2>
                    </div>
                    <div id="playlists-carousel" class="carousel-viewport">
                        <!-- Pages 2x3 générées par JS -->
                    </div>
                    <div id="playlists-pagination" class="pagination-dots"></div>
                </div>
            </section>

            <!-- VUE 2 : DÉTAIL PLAYLIST -->
            <section id="view-playlist" class="view-section hidden">
                <div class="playlist-sticky-header">
                    <div class="view-header playlist-header-centered">
                        <button id="btn-playlist-back" class="btn-icon header-back-btn">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                            </svg>
                        </button>
                        <h2 id="view-playlist-title" class="view-title">Titre Playlist</h2>
                    </div>
                    <div class="view-actions">
                        <button id="btn-playlist-play-all" class="btn-play-all">
                            <svg class="svg-icon-small" style="vertical-align: middle; margin-right: 5px;"
                                viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                            Tout lire
                        </button>
                    </div>
                </div>
                <div id="playlist-tracks-container" class="list-container">
                    <!-- Rempli par JS -->
                </div>
            </section>

            <!-- VUE 3 : COLLECTION (TOUT AFFICHER) -->
            <section id="view-collection" class="view-section hidden">
                <div class="playlist-sticky-header">
                    <div class="view-header playlist-header-centered">
                        <button id="btn-collection-back" class="btn-icon header-back-btn">
                            <svg class="svg-icon" viewBox="0 0 24 24">
                                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                            </svg>
                        </button>
                        <h2 id="view-collection-title" class="view-title">Collection</h2>
                    </div>
                </div>
                <div id="collection-list-container" class="list-container">
                    <!-- Rempli par JS -->
                </div>
            </section>

        </main>

        <!-- MINI LECTEUR (PERSISTANT) -->
        <div id="mini-player" class="mini-player hidden">
            <img id="mini-track-cover" src="" alt="Cover" class="mini-cover">
            <div class="mini-track-info">
                <div id="mini-track-title-container" class="marquee-container mini-title">
                    <span id="mini-track-title" class="marquee-text">Titre</span>
                </div>
                <div id="mini-track-artist-container" class="marquee-container mini-artist">
                    <span id="mini-track-artist" class="marquee-text">Artiste</span>
                </div>
            </div>
            <div class="mini-controls">
                <button id="btn-mini-play-pause" class="btn-icon" aria-label="Lecture">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
                <button id="btn-mini-next" class="btn-icon" aria-label="Suivant">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- FULL PLAYER (LECTEUR ANCRÉ + FILE D'ATTENTE SCROLLABLE) -->
        <div id="full-player" class="full-player hidden">

            <div class="full-player-top">
                <div class="full-player-header">
                    <button id="btn-minimize-player" class="btn-icon" aria-label="Réduire le lecteur">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                        </svg>
                    </button>
                    <!-- Affichage de l'état Gemini/API uniquement (vide par défaut) -->
                    <span id="full-player-status" style="margin-right: 35px;"></span>
                </div>

                <img id="track-cover" src="" alt="Pochette de l'album" class="full-cover">

                <div class="track-info">
                    <div class="track-text">
                        <h2 id="track-title-container" class="marquee-container">
                            <span id="track-title" class="marquee-text">Titre</span>
                        </h2>
                        <h3 id="track-artist-container" class="marquee-container">
                            <span id="track-artist" class="marquee-text">Artiste</span>
                        </h3>
                    </div>
                    <button id="btn-add-playlist" class="btn-icon" aria-label="Ajouter à une playlist">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg>
                    </button>
                </div>

                <div class="progress-container">
                    <span id="time-current">0:00</span>
                    <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                    <span id="time-total">0:00</span>
                </div>

                <div class="player-controls">
                    <button id="btn-restart-playlist" class="btn-icon" aria-label="Recommencer la session">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" />
                        </svg>
                    </button>
                    <button id="btn-prev" class="btn-icon" aria-label="Précédent">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                        </svg>
                    </button>
                    <button id="btn-play-pause" class="btn-icon btn-main" aria-label="Lecture">
                        <svg class="svg-icon-large" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                    <button id="btn-next" class="btn-icon" aria-label="Suivant">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                        </svg>
                    </button>
                    <button id="btn-skip-playlist" class="btn-icon" aria-label="Sauter la session">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="full-player-queue">
                <div id="queue-tracks-container" class="list-container">
                    <!-- Rempli par JS avec les groupes et headers collants -->
                </div>
            </div>
        </div>

        <!-- MODALE AJOUT PLAYLIST -->
        <div id="playlist-add-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 style="margin: 0; font-size: 1.1rem;">Ajouter à une playlist</h3>
                    <button id="btn-close-modal" class="btn-icon">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path
                                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                        </svg>
                    </button>
                </div>
                <div id="add-modal-list" class="list-container" style="margin-top: 15px;">
                    <!-- Rempli par JS -->
                </div>
            </div>
        </div>

    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
