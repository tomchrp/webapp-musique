<!--
==============================================================================
Fichier : frontend/index.html
Description : 
Ajout des éléments nécessaires pour la Phase 3 :
1. Le conteneur de progression (.progress-container) avec un <input type="range"> 
   pour la barre interactive, et deux spans pour l'affichage dynamique du temps.
2. Le conteneur de toast (#toast-container) pour afficher les notifications 
   éphémères de manière non intrusive lors de l'ajout à la file d'attente.
==============================================================================
-->
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Music AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="background-blur"></div>

    <!-- Notification visuelle (Toasts) -->
    <div id="toast-container" class="hidden"></div>

    <div class="app-container">

        <!-- Zone 1 : Utilitaires et Recherche -->
        <header class="top-zone">
            <div class="search-wrapper">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Rechercher un titre, un artiste..."
                        autocomplete="off">
                </div>
                <!-- Dropdown pour les résultats en direct -->
                <div id="search-results" class="search-results-dropdown hidden"></div>
            </div>
        </header>

        <main class="player-zone hidden" id="player-container">
            <img id="track-cover" src="" alt="Pochette de l'album" class="hidden">
            <div class="track-info">
                <h2 id="track-title">Titre</h2>
                <h3 id="track-artist">Artiste</h3>
            </div>

            <!-- Barre de progression interactive -->
            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <span id="time-total">0:00</span>
            </div>

            <div class="player-controls">
                <button id="btn-prev" class="btn-icon">|◄</button>
                <button id="btn-play-pause" class="btn-icon btn-main">►</button>
                <button id="btn-next" class="btn-icon">►|</button>
            </div>
            <p id="next-track-info">À suivre : ...</p>
        </main>

        <footer class="fab-zone">
            <p id="status-text">Assistant prêt</p>
            <div class="fab-wrapper">
                <button id="toggle-btn" class="fab-btn btn-disconnected"></button>
            </div>
        </footer>

    </div>
    <script src="app.js"></script>
</body>

</html>
