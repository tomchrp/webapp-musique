<!--
==============================================================================
Chemin : frontend/index.html
Utilité : Structure principale de l'interface utilisateur (HTML5).
Mise à jour : Modification de la valeur par défaut du volume-slider à 0.5 (50%).
==============================================================================
-->
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Music AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="background-blur"></div>

    <div id="toast-container" class="hidden"></div>

    <div class="app-container">

        <header class="top-zone">
            <button id="btn-library" class="btn-icon header-icon" aria-label="Bibliothèque">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
            </button>

            <div class="search-wrapper">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Rechercher un titre..." autocomplete="off">
                </div>
                <div id="search-results" class="search-results-dropdown hidden"></div>
            </div>

            <div class="volume-control header-icon">
                <button id="btn-volume" class="btn-icon" aria-label="Volume">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path
                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                    </svg>
                </button>
                <input type="range" id="volume-slider" class="volume-slider hidden" min="0" max="1" step="0.01"
                    value="0.5">
            </div>
        </header>

        <main class="player-zone hidden" id="player-container">
            <img id="track-cover" src="" alt="Pochette de l'album" class="hidden">

            <div class="track-info">
                <div class="track-text">
                    <h2 id="track-title">Titre</h2>
                    <h3 id="track-artist">Artiste</h3>
                </div>
                <button id="btn-add-playlist" class="btn-icon" aria-label="Ajouter à une playlist">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                </button>
            </div>

            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <span id="time-total">0:00</span>
            </div>

            <div class="player-controls">
                <button id="btn-restart-playlist" class="btn-icon" aria-label="Recommencer la session">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" />
                    </svg>
                </button>

                <button id="btn-prev" class="btn-icon" aria-label="Précédent">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                    </svg>
                </button>
                <button id="btn-play-pause" class="btn-icon btn-main" aria-label="Lecture">
                    <svg class="svg-icon-large" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
                <button id="btn-next" class="btn-icon" aria-label="Suivant">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                    </svg>
                </button>

                <button id="btn-skip-playlist" class="btn-icon" aria-label="Sauter la session">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
                    </svg>
                </button>
            </div>

            <div id="queue-preview-container" class="queue-preview-list hidden"></div>
        </main>

        <footer class="fab-zone">
            <p id="status-text">Assistant prêt</p>
            <div class="fab-wrapper">
                <button id="toggle-btn" class="fab-btn btn-disconnected"></button>
            </div>
        </footer>

        <!-- Volet 1 : Bibliothèque Principale -->
        <div id="library-drawer" class="drawer hidden">
            <div class="drawer-header">
                <button id="btn-drawer-back" class="btn-icon hidden">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                    </svg>
                </button>
                <h2 id="drawer-title" class="hidden">Mes Playlists</h2>
                <div class="drawer-tabs" id="drawer-tabs">
                    <button id="tab-playlists" class="tab-btn active">Playlists</button>
                    <button id="tab-discovery" class="tab-btn">Écoutés récemment</button>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button id="btn-drawer-refresh" class="btn-icon" aria-label="Rafraîchir">
                        <svg class="svg-icon" viewBox="0 0 24 24">
                            <path
                                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="drawer-actions hidden" id="drawer-actions">
                <button id="btn-drawer-play" class="btn-play-all">
                    <svg class="svg-icon-small" style="vertical-align: middle; margin-right: 5px;" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    Jouer la playlist
                </button>
            </div>
            <div id="library-content" class="drawer-content"></div>
            <div id="discovery-content" class="drawer-content hidden listen-again-grid"></div>
        </div>

        <!-- Volet 2 : Ajout à une playlist -->
        <div id="playlist-add-drawer" class="drawer hidden" style="height: 60vh; z-index: 90;">
            <div class="drawer-header">
                <h2 style="flex: 1; text-align: center; margin: 0; font-size: 1.1rem;">Ajouter à une playlist</h2>
            </div>
            <div id="add-drawer-list" class="drawer-content" style="padding: 10px 20px;"></div>
        </div>

        <!-- Volet 3 : File d'attente (Queue Drawer) -->
        <div id="queue-drawer" class="drawer hidden" style="height: 75vh; z-index: 85;">
            <div class="drawer-header">
                <h2 style="flex: 1; text-align: center; margin: 0; font-size: 1.2rem;">File d'attente</h2>
            </div>
            <div id="queue-content" class="drawer-content" style="padding: 0;"></div>
        </div>

    </div>
    <script type="module" src="js/main.js"></script>
</body>

</html>
